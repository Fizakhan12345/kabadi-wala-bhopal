<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container bar">
    <a href="#top" class="brand" (click)="closeMenu()">
      <span class="brand-mark">KB</span>
      <span class="brand-name">
        Kabadi Wala <em>Bhopal</em>
      </span>
    </a>

    <nav class="links" [class.is-open]="menuOpen()">
      <a href="#rates" (click)="closeMenu()">Aaj Ka Bhaav</a>
      <a href="#services" (click)="closeMenu()">Services</a>
      <a href="#why-us" (click)="closeMenu()">Why Us</a>
      <a href="#contact" (click)="closeMenu()">Contact</a>
      <a [href]="site.phoneHref" class="call-pill mobile-only">Call {{ site.phone }}</a>
    </nav>

    <a [href]="site.phoneHref" class="call-pill desktop-only">
      <span class="dot"></span>
      {{ site.phone }}
    </a>

    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
